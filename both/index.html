<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Throwing and Running Assessments</title>
<style>
html, body { margin: 0; height: 100%; background: #05080b; overflow: hidden; cursor: none; }
iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity .8s ease; pointer-events: none; }
iframe.on { opacity: 1; }
</style>
</head>
<body>
<!-- The lab TV's everyday page: the throwing loop plays all the way through, then the running loop, then repeats.
     Each loop is its own page on this site (../ and ../run/); the one not showing is paused. -->
<iframe id="a" title="Throwing assessment"></iframe>
<iframe id="b" title="Running assessment"></iframe>
<script>
const params = new URLSearchParams(location.search);
// ?a= and ?b= override the two addresses (local previews, where folders have no index page)
const SRC = [params.get('a') || '../', params.get('b') || '../run/'];
const F = [document.getElementById('a'), document.getElementById('b')];
for (const ev of ['click', 'contextmenu', 'keydown', 'wheel', 'touchstart']) addEventListener(ev, e => e.preventDefault(), { passive: false });
let cur = 0, timer = 0;
const api = i => { try { const w = F[i].contentWindow; return w && w.__info && w.__restart && w.__pause ? w : null; } catch (e) { return null; } };
function show(i) {
  const w = api(i), o = api(1 - i);
  if (!w) { timer = setTimeout(() => show(i), 1000); return; }   // still loading
  cur = i;
  w.__restart(); w.__pause(false);
  F[i].classList.add('on'); F[1 - i].classList.remove('on');
  if (o) setTimeout(() => { if (cur === i) o.__pause(true); }, 900);   // after the cross-fade
  clearTimeout(timer);
  timer = setTimeout(() => show(1 - i), w.__info().total * 1000);
}
let loaded = 0;
F.forEach((f, i) => { f.addEventListener('load', () => { if (++loaded === 2) setTimeout(() => { const o = api(1); if (o) o.__pause(true); show(0); }, 1500); }); f.src = SRC[i]; });
// safety net for an unattended TV: reload once a day at 4 a.m. if the page has been up for 20 hours or more
const t0 = performance.now();
setInterval(() => { if (performance.now() - t0 > 20 * 3600e3 && new Date().getHours() === 4) location.reload(); }, 10 * 60e3);
</script>
</body>
</html>
